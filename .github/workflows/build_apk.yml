name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Generate Official Android Platform Scaffolding
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.spendly --project-name=spendly

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: |
          set +e
          flutter build apk --release --no-tree-shake-icons > build.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "### ❌ Build Failed (Exit Code $STATUS)" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 100 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat build.log
            exit $STATUS
          fi
          echo "### ✅ Build Succeeded!" >> $GITHUB_STEP_SUMMARY

      - name: Locate APK files
        run: find build -name "*.apk"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: spendly-app-release
          path: build/app/outputs/**/*.apk
          if-no-files-found: error
