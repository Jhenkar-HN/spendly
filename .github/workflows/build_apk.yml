name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Generate Official Android Platform Scaffolding
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.spendly --project-name=spendly

      - name: Configure Android SDK versions
        run: |
          # Ensure minSdk is 21 and compileSdk is 34
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle || true
          sed -i 's/minSdk flutter.minSdkVersion/minSdk 21/g' android/app/build.gradle || true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: |
          set +e
          flutter build apk --release --no-tree-shake-icons > build.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            cat build.log
            exit $STATUS
          fi

      - name: Push failure log to branch
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-failure
          git add build.log -f
          git commit -m "Auto-captured build failure log [skip ci]"
          git push origin build-failure -f

      - name: Prepare Spendly APK
        if: success()
        run: |
          APK_DIR="build/app/outputs/flutter-apk"
          if [ -f "$APK_DIR/app-release.apk" ]; then
            cp "$APK_DIR/app-release.apk" "$APK_DIR/Spendly.apk"
          fi

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spendly-app-release
          path: build/app/outputs/**/*.apk
          if-no-files-found: error

      - name: Extract version from pubspec.yaml
        if: success()
        id: get_version
        run: |
          VERSION=$(sed -nE 's/^version:[[:space:]]*([^+\s"'"'"']+).*/\1/p' pubspec.yaml | tr -d '\r')
          if [ -z "$VERSION" ]; then
            VERSION="1.0.0"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Publish GitHub Release
        if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.get_version.outputs.version }}"
          TITLE="Spendly $TAG"
          APK_PATH="build/app/outputs/flutter-apk/Spendly.apk"

          if [ ! -f "$APK_PATH" ]; then
            APK_PATH=$(find build/app/outputs -name "Spendly.apk" -o -name "app-release.apk" -type f | head -n 1)
          fi

          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Release APK not found"
            exit 1
          fi

          echo "Publishing release asset: $APK_PATH with tag: $TAG"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists. Updating release asset and notes..."
            gh release upload "$TAG" "$APK_PATH" --clobber
            gh release edit "$TAG" --title "$TITLE"
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" "$APK_PATH" \
              --title "$TITLE" \
              --notes "Spendly release build for $TAG (commit: ${{ github.sha }})." \
              --target "${{ github.sha }}"
          fi
